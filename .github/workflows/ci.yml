# Runs every backend and frontend test on every push and pull request
# (goal-spec criterion 22). Render deploys the backend only after these
# checks pass; the frontend deploy job is added in Phase D6.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  backend-postgres:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A throwaway PostgreSQL that exists only during this run. Its made-up
    # password guards nothing real; the online database is never used here.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: expenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://postgres:throwaway@localhost:5432/expenses_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
